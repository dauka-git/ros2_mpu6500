mpu6500_sensor:
  ros__parameters:
    i2c_device: "/dev/i2c-7"
    i2c_address: 0x68
    publish_rate_hz: 100
    frame_id: "imu_link"
    
    # Gyroscope offsets (rad/s) - to zero out drift
    gyro_x_offset: -0.132565   # Subtract this to get ~0
    gyro_y_offset: 0.041835    # Subtract this to get ~0
    gyro_z_offset: 0.015721    # Subtract this to get ~0
    
    # Accelerometer offsets (m/s²)
    accel_x_offset: 0.100556   # Subtract to get 0
    accel_y_offset: 0.059855   # Subtract to get 0
    accel_z_offset: 0.020592   # 9.830592 - 9.81 = 0.020592