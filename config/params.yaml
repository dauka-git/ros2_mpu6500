mpu6500_sensor:
  ros__parameters:
    i2c_device: "/dev/i2c-7"
    i2c_address: 0x68
    publish_rate_hz: 100
    frame_id: "imu_link"
    
    # Reset offsets - recalibrate after changes
    gyro_x_offset: 0.0
    gyro_y_offset: 0.0
    gyro_z_offset: 0.0
    accel_x_offset: 0.0
    accel_y_offset: 0.0
    accel_z_offset: 0.0